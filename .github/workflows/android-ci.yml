name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: Compile instrumentation tests
        run: |
          set -o pipefail
          ./gradlew assembleDebugAndroidTest --stacktrace 2>&1 | tee -a build.log

      - name: Assemble release APK (minified)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a build.log

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \; || true
          ls -la artifacts || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open100x-apks
          path: artifacts/*.apk
          if-no-files-found: warn

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open100x-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Publish build log on failure
        if: failure()
        run: |
          tail -n 4000 build.log > build-tail.log || echo "no build log" > build-tail.log
          mkdir -p /tmp/ci && cd /tmp/ci
          cp "$GITHUB_WORKSPACE/build-tail.log" build.log
          git init -q -b ci-logs
          git add build.log
          git -c user.email=ci@users.noreply.github.com -c user.name="CI" commit -q -m "ci build log"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
